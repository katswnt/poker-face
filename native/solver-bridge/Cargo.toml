[package]
name = "solver-bridge"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "poker-face spot-contract bridge to b-inary/postflop-solver"

[lib]
name = "solver_bridge"
path = "src/lib.rs"

[[bin]]
name = "solver-bridge"
path = "src/main.rs"
required-features = ["native"]

[features]
default = ["native"]
native = ["dep:libc", "threads"]
threads = ["dep:rayon", "postflop-solver/rayon"]
wasm = ["dep:web-time"]

[dependencies]
# Pinned: upstream makes breaking changes without version bumps. Keep in sync with
# POSTFLOP_SOLVER_COMMIT in src/lib/solver/bridge/contract.ts and src/lib.rs.
# The default `bincode` feature (save/load files) is off: its `2.0.0-rc.3` requirement now
# resolves to bincode 2.0.1, which the pinned source does not compile against, and the
# bridge never uses postflop-solver's file format.
postflop-solver = { git = "https://github.com/b-inary/postflop-solver", rev = "9d1509fe5077d019825f833eed04b16d342dfda1", default-features = false }
libc = { version = "0.2", optional = true }
rayon = { version = "1", optional = true }
web-time = { version = "=1.1.0", optional = true }
serde = { version = "1", features = ["derive"] }
# Preserve JSON.stringify(f32-as-f64) exactly before the strict f32 weight check.
# Shared by native and WASM; never compensate by rounding incoming ranges.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = "thin"
