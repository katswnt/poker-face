[package]
edition = "2024"
rust-version = "1.90"
name = "mccfr"
version = "1.2.0-poker-face.1"
authors = ["Kelechi Ukah <ukahkelechi@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Game-agnostic Monte Carlo Counterfactual Regret Minimization framework"
readme = "README.md"
keywords = [
    "mccfr",
    "cfr",
    "game-theory",
    "nash-equilibrium",
    "solver",
]
categories = [
    "algorithms",
    "mathematics",
    "game-development",
]
license = "MIT"
repository = "https://github.com/krukah/robopoker"
resolver = "2"

[features]
async = [
    "async-trait",
    "futures",
]
default = ["server"]
server = [
    "pokerkit/server",
    "rayon",
    "vitals",
]

[lib]
name = "mccfr"
path = "src/lib.rs"

[dependencies.async-trait]
version = "0.1"
optional = true

[dependencies.futures]
version = "0.3"
optional = true

[dependencies.kicker]
version = "1.2"

[dependencies.monge]
version = "1.2"

[dependencies.paste]
version = "1.0"

[dependencies.petgraph]
version = "0.6"

[dependencies.pokerkit]
version = "1.2"

[dependencies.rand]
