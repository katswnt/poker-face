[package]
name = "robopoker-referee-v2"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
description = "Pinned MCCFR full-tree prerequisite audit; no production engine integration"

[dependencies]
mccfr = { path = "vendor/mccfr", version = "=1.2.0-poker-face.1" }
monge = "=1.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
debug = false
strip = true
