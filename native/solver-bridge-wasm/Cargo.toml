[package]
name = "solver-bridge-wasm"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
solver-bridge = { path = "../solver-bridge", default-features = false, features = ["wasm"] }
wasm-bindgen = "=0.2.104"
serde = "1"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
