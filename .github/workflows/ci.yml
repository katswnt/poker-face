name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test (domain suite)
        run: npm test

      - name: Audit Kuhn solver artifact
        run: npm run audit:kuhn

      - name: Audit Leduc solver artifact
        run: npm run audit:leduc

      - name: Audit heads-up turn and river artifact
        run: npm run audit:turn

      - name: Audit shared-public turn backend
        run: npm run audit:turn:compact

      - name: Audit configurable river v3 artifact
        run: npm run audit:river:v3

      - name: Audit river benchmark exchange
        run: npm run audit:river:exchange

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Test (browser smoke suite)
        run: npm run test:e2e
