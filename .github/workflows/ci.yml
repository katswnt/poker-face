name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test (domain suite)
        run: npm test

      - name: Audit hand evaluator category counts
        run: npm run audit:math

      - name: Audit exact push/fold equity matrix
        run: npm run audit:equity-matrix

      - name: Audit heads-up river v1, v2, compact, scorekeeper and factorized engines
        run: |
          npm run audit:river
          npm run audit:river:v2
          npm run audit:river:compact
          npm run audit:river:scorekeeper
          npm run audit:river:factorized

      - name: Audit Kuhn solver artifact
        run: npm run audit:kuhn

      - name: Audit Leduc solver artifact
        run: npm run audit:leduc

      - name: Audit heads-up turn and river artifact
        run: npm run audit:turn

      - name: Audit shared-public turn backend
        run: npm run audit:turn:compact

      - name: Reproduce and independently grade wider-range turn artifact
        run: npm run audit:turn:vector

      - name: Reproduce and independently grade configurable turn corpus
        run: npm run audit:turn:v2

      - name: Reproduce saved turn explorer chunks
        run: npm run audit:turn:explorer

      - name: Reproduce tiny joint flop reference
        run: npm run audit:flop:reference

      - name: Rebuild and independently grade complete wider flop policy
        run: npm run audit:flop:source

      - name: Validate and independently grade the six saved flop sources
        run: npm run audit:flop:library

      - name: Reproduce every saved flop browser slice
        run: npm run audit:flop:explorer

      - name: Audit configurable river v3 artifact
        run: npm run audit:river:v3

      - name: Audit river benchmark exchange
        run: npm run audit:river:exchange

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Test (browser smoke suite)
        run: npm run test:e2e

  # Native postflop-solver bridge (AGPL-3.0 dependency pinned in Cargo.lock): build with the
  # pinned toolchain, lint, run the crate's semantic tests, then drive the real binary through
  # the Node runner and the B2 referee (the main job's npm test skips those binary-dependent
  # tests when the binary is absent).
  bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/solver-bridge

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build solver-bridge
        run: npm run build:bridge

      - name: Format and lint solver-bridge
        working-directory: native/solver-bridge
        run: |
          cargo fmt --check
          cargo clippy --release --locked --all-targets -- -D warnings

      - name: Test solver-bridge
        run: npm run test:bridge

      - name: Drive solver-bridge through the Node runner and the referee tests
        run: node --import tsx --test test/bridge-runner.test.ts test/bridge-referee.test.ts

      - name: Referee audit (postflop-solver vs our engines on the locked referee games)
        run: npm run audit:bridge

  # Slow reproducibility audits run in parallel with the main job. audit:flop:vector is
  # local-only: its bit-identical re-solve needs ~14 minutes on a CI runner, beyond the
  # flop job's documented 10-minute limit. CI still re-grades that saved policy
  # independently (audit:flop:source above).
  slow-audits:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        audit:
          - audit:multiway-river
          - audit:multiway-raised-river
          - audit:multiway-two-size-river
          - audit:multiway-side-pot-river
          - audit:multiway-four-player-river
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Run ${{ matrix.audit }}
        run: npm run ${{ matrix.audit }}
