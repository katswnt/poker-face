name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test (domain suite)
        run: npm test

      - name: Audit Kuhn solver artifact
        run: npm run audit:kuhn

      - name: Audit Leduc solver artifact
        run: npm run audit:leduc

      - name: Audit heads-up turn and river artifact
        run: npm run audit:turn

      - name: Audit shared-public turn backend
        run: npm run audit:turn:compact

      - name: Reproduce and independently grade wider-range turn artifact
        run: npm run audit:turn:vector

      - name: Reproduce and independently grade configurable turn corpus
        run: npm run audit:turn:v2

      - name: Reproduce saved turn explorer chunks
        run: npm run audit:turn:explorer

      - name: Reproduce tiny joint flop reference
        run: npm run audit:flop:reference

      - name: Rebuild and independently grade complete wider flop policy
        run: npm run audit:flop:source

      - name: Validate and independently grade the six saved flop sources
        run: npm run audit:flop:library

      - name: Reproduce every saved flop browser slice
        run: npm run audit:flop:explorer

      - name: Audit configurable river v3 artifact
        run: npm run audit:river:v3

      - name: Audit river benchmark exchange
        run: npm run audit:river:exchange

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Test (browser smoke suite)
        run: npm run test:e2e
